name: Quality

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.browser }})
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-15-intel' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      STAGING: '1'
      STAGING_URL: http://127.0.0.1:3100
      STAGING_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.24.0 --force
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:staging
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Start staging server
        shell: bash
        run: |
          pnpm start --hostname 127.0.0.1 --port 3100 > staging-server.log 2>&1 &
          server_pid=$!
          echo "STAGING_SERVER_PID=$server_pid" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if curl --fail --silent "$STAGING_URL" > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat staging-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent "$STAGING_URL" > /dev/null || { cat staging-server.log; exit 1; }
      - name: Audit regressions
        timeout-minutes: 5
        run: pnpm test:audit-fixes
      - name: Homepage and navigation
        timeout-minutes: 5
        run: pnpm test:staging
      - name: Header logo
        timeout-minutes: 5
        run: pnpm test:logo
      - name: Team
        timeout-minutes: 5
        run: pnpm test:team
      - name: Work
        timeout-minutes: 5
        run: pnpm test:work
      - name: Imprints
        timeout-minutes: 5
        run: pnpm test:imprints
      - name: Case studies
        timeout-minutes: 5
        run: pnpm test:cases
      - name: Responsive layouts
        timeout-minutes: 5
        run: pnpm test:responsive
      - name: Cursor
        timeout-minutes: 5
        run: node scripts/check-cursor.mjs
      - name: Outpost draft
        if: matrix.browser == 'chromium'
        timeout-minutes: 5
        run: pnpm test:outpost
      - name: Stop staging server
        if: always()
        run: |
          if [ -n "${STAGING_SERVER_PID:-}" ]; then
            kill "$STAGING_SERVER_PID" 2>/dev/null || true
          fi
      - name: Save failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: quality-${{ matrix.browser }}
          path: |
            artifacts/
            staging-server.log
          retention-days: 7
